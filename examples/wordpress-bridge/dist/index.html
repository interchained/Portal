<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal app shell</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      main { text-align: center; opacity: 0.75; padding: 0 6vw; }
      code { background: rgba(127,127,127,.15); padding: .15em .45em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>⬡ Portal app shell</h1>
      <p>This static shell serves paths the WordPress bridge does not resolve.</p>
      <p>WordPress-published routes render server-side via <code>wp-portal-bridge</code>.</p>
    </main>
  </body>
</html>
